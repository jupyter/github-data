name: Generate DB and Create Release

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  contents: write  # Required for creating releases

jobs:
  # A matrix can't read a file directly, so this first job turns the list of
  # organizations in orgs.toml into JSON for the `build` matrix below.
  orgs:
    runs-on: ubuntu-latest
    outputs:
      orgs: ${{ steps.load.outputs.orgs }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the organization list from orgs.toml
        id: load
        shell: python
        run: |
          import json, os, tomllib
          orgs = tomllib.load(open("orgs.toml", "rb"))["orgs"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"orgs={json.dumps(orgs)}\n")

  # Scrape each organization in its own job, in parallel.
  build:
    needs: orgs
    runs-on: ubuntu-latest
    strategy:
      matrix:
        org: ${{ fromJSON(needs.orgs.outputs.orgs) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: |
          uv pip install -r requirements.txt --system

      - name: Create data directory
        run: mkdir -p data

      - name: Run database generation script
        run: python scripts/download_issues.py ${{ matrix.org }}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}

      - name: Upload job outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-${{ matrix.org }}
          path: data/${{ matrix.org }}.db

  # Attach every .db file to the `latest` release.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./data
          merge-multiple: true

      - name: Get current date for release name
        id: get_date
        run: echo "RELEASE_DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Create Release and Upload Database Files
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.RELEASE_DATE }}
          tag_name: latest
          files: data/*.db
